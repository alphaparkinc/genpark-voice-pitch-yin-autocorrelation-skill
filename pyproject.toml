[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-voice-pitch-yin-autocorrelation-skill"
version = "1.0.0"
description = "Fundamental frequency (F0) pitch detector utilizing the YIN algorithm and cumulative mean normalized difference function."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-voice-pitch-yin-autocorrelation-skill"
Repository = "https://github.com/alphaparkinc/genpark-voice-pitch-yin-autocorrelation-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-voice-pitch-yin-autocorrelation-skill/issues"
